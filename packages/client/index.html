<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Deadtiles</title>
    <link rel="icon" type="image/png" href="/brand/deadtiles-icon.png" />
    <link rel="apple-touch-icon" href="/brand/deadtiles-icon.png" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        scrollbar-width: thin;
        scrollbar-color: rgba(126, 207, 126, 0.75) rgba(0, 0, 0, 0.28);
      }
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.28);
        border-radius: 4px;
      }
      *::-webkit-scrollbar-thumb {
        background: rgba(94, 168, 94, 0.72);
        border: 2px solid rgba(10, 14, 10, 0.92);
        border-radius: 4px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: rgba(126, 207, 126, 0.9);
      }
      *::-webkit-scrollbar-corner {
        background: transparent;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a2332;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        --browser-bottom-inset: 0px;
        --hud-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      }
      /* Mobile browser chrome is not in safe-area-inset-bottom. APK uses safe-area only. */
      body.is-mobile:not(.is-native) {
        --hud-bottom: calc(
          12px + max(env(safe-area-inset-bottom, 0px), var(--browser-bottom-inset, 56px))
        );
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      #damage-overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        overflow: hidden;
      }
      #damage-overlay-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #damage-overlay-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 40, 40, 0.55) 0%,
          rgba(140, 0, 0, 0.65) 100%
        );
      }
      #hud {
        display: none;
      }

      #world-clock {
        position: fixed;
        top: max(12px, env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        z-index: 55;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font: 700 13px/1.2 "Consolas", "ui-monospace", monospace;
        letter-spacing: 0.12em;
        color: #d8e8f4;
        background: rgba(8, 12, 18, 0.62);
        border: 1px solid rgba(180, 210, 230, 0.22);
        border-radius: 4px;
        padding: 6px 12px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
        text-align: center;
      }
      #world-clock[hidden] {
        display: none !important;
      }
      #combat-lock-banner {
        position: fixed;
        top: max(46px, calc(env(safe-area-inset-top, 0px) + 36px));
        left: 50%;
        transform: translateX(-50%);
        z-index: 80;
        pointer-events: none;
        padding: 6px 12px;
        border-radius: 4px;
        border: 1px solid rgba(220, 120, 80, 0.55);
        background: rgba(28, 12, 8, 0.88);
        color: #f0d0c0;
        font: 700 13px/1.2 system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-align: center;
        white-space: nowrap;
      }
      #world-clock-time[hidden] {
        display: none !important;
      }

      /* ── Player stats HUD (bottom-left) ───────────────────────────────── */
      #player-hud {
        position: fixed;
        bottom: max(14px, env(safe-area-inset-bottom, 0px));
        left: 14px;
        z-index: 55;
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: none;
      }
      #player-avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(10, 14, 10, 0.82);
        border: 2px solid rgba(100, 220, 100, 0.45);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #player-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        display: block;
      }
      #player-bars {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .player-bar-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .player-bar-label {
        font: 700 9px/1 system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #a0e8a0;
      }
      .player-bar-track {
        width: 120px;
        height: 4px;
        min-height: 4px;
        max-height: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
        line-height: 0;
        font-size: 0;
      }
      .player-bar-fill {
        display: block;
        height: 100%;
        border-radius: 2px;
        box-shadow: none;
        transition: width 0.15s ease, background 1.2s ease;
      }
      #health-cap,
      #health-lost,
      #health-fill {
        position: absolute;
        top: 0;
        height: 100%;
      }
      #health-cap,
      #main-menu-health-cap {
        border-radius: 0;
      }
      #health-cap {
        left: 0;
        width: 100%;
        background: transparent;
        z-index: 0;
        transition: width 0.15s ease;
      }
      #health-lost,
      #main-menu-health-lost {
        right: 0;
        width: 0;
        background: #1a3a14;
        box-shadow: none;
        z-index: 0;
        border-radius: 0;
        transition: width 0.15s ease;
      }
      #health-fill {
        left: 0;
        background: #7a1a1a;
        z-index: 1;
      }
      #stamina-fill {
        background: #7a5a0a;
      }
      #hunger-fill {
        background: #5a3a12;
      }
      #thirst-fill {
        background: #12405a;
      }
      #temp-fill {
        background: #5a7a52;
      }
      /*
       * Full-viewport vignette. Only opacity is transitioned: animating the
       * 90px inset shadow re-rasterises the whole viewport every frame of the
       * fade, and the opacity fade already reads the same.
       */
      #temperature-fx {
        position: fixed;
        inset: 0;
        z-index: 45;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #temperature-fx.temp-fx-cold {
        opacity: 1;
        box-shadow: inset 0 0 90px 20px rgba(90, 160, 220, 0.28);
      }
      #temperature-fx.temp-fx-hot {
        opacity: 1;
        box-shadow: inset 0 0 90px 20px rgba(220, 70, 30, 0.22);
      }
      #infection-fx {
        position: fixed;
        inset: 0;
        z-index: 45;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        box-shadow: inset 0 0 90px 24px rgba(110, 190, 50, 0.42);
      }
      @keyframes bar-flash-red {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .player-bar-track--critical .player-bar-fill {
        animation: bar-flash-red 0.8s ease-in-out infinite;
        background: #c0262a !important;
        box-shadow: none !important;
      }
      .player-bar-label--critical {
        color: #f08080;
        animation: bar-flash-red 0.8s ease-in-out infinite;
      }
      body.inventory-open #game canvas,
      body.journal-open #game canvas,
      body.container-loot-open #game canvas,
      body.trader-open #game canvas,
      body.market-open #game canvas,
      body.red-order-dialog-open #game canvas,
      body.ashen-dialog-open #game canvas,
      body.faction-attack-warning-open #game canvas,
      body.death-screen-open #game canvas,
      body.onboarding-open #game canvas,
      body.onboarding-legend-open #game canvas,
      body.map-open #game canvas {
        cursor: default !important;
      }
      #inventory-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
      }
      #inventory-overlay[hidden] {
        display: none;
      }
      #journal-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        padding: 16px;
        box-sizing: border-box;
      }
      #journal-overlay[hidden] {
        display: none;
      }
      .journal-panel {
        width: min(440px, 92vw);
        max-height: min(78vh, 720px);
      }
      .journal-header-text {
        min-width: 0;
        flex: 1 1 auto;
      }
      .journal-tabs {
        display: flex;
        gap: 6px;
        padding: 8px 16px 0;
        border-bottom: 1px solid rgba(100, 220, 100, 0.22);
        flex: 0 0 auto;
      }
      .journal-tab {
        appearance: none;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        padding: 8px 12px;
        background: transparent;
        color: #a8c8a8;
        font: 600 13px/1.2 system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .journal-tab:hover {
        color: #d4f0d4;
      }
      .journal-tab--active {
        color: #e8f8e8;
        background: rgba(94, 200, 94, 0.14);
        border-color: rgba(100, 220, 100, 0.45);
      }
      .journal-header {
        flex: 0 0 auto;
      }
      .journal-body {
        padding: 12px 16px 16px;
        overflow-y: auto;
        flex: 1 1 auto;
        min-height: 0;
        -webkit-overflow-scrolling: touch;
      }
      .journal-empty {
        margin: 12px 0;
        color: #9ab89a;
      }
      .journal-section-label {
        margin: 4px 0 0;
        color: #7ecf7e;
        font: 700 11px/1.2 system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .journal-section-label:first-child {
        margin-top: 0;
      }
      .journal-quest-list,
      .journal-skill-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .journal-panel .craft-recipe {
        border-color: rgba(100, 220, 100, 0.22);
      }
      .journal-quest--active {
        border-color: rgba(159, 232, 48, 0.45);
        background: rgba(94, 200, 94, 0.08);
      }
      .journal-panel .craft-recipe-summary-meta {
        color: #9ab89a;
      }
      .journal-panel .craft-recipe--ready .craft-recipe-summary-meta {
        color: #98c898;
      }
      .journal-panel .craft-recipe-chevron {
        color: #a8c8a8;
      }
      .journal-panel .craft-recipe-details {
        border-top-color: rgba(100, 220, 100, 0.22);
      }
      .journal-quest-desc,
      .journal-quest-meta {
        margin: 0;
        color: #b8d0b8;
        font: 13px/1.4 system-ui, sans-serif;
      }
      .journal-quest-objectives {
        margin: 0;
        padding-left: 18px;
        color: #c8e0c8;
        font: 13px/1.4 system-ui, sans-serif;
      }
      .quest-stage--done {
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }
      .journal-quest-actions {
        display: flex;
        gap: 8px;
      }
      .journal-abandon-btn {
        background: rgba(72, 28, 28, 0.9) !important;
        border-color: rgba(220, 100, 100, 0.55) !important;
        color: #f0c8c8 !important;
      }
      .journal-skill-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
      }
      .journal-skill-sub-name {
        font: 600 13px/1.2 system-ui, sans-serif;
        color: #d4f0d4;
      }
      .journal-skill-meta {
        color: #9ab89a;
        font: 12px/1.2 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .journal-skill-buff {
        color: #e6c15a;
        font-weight: 700;
      }
      .journal-skill-benefit {
        margin: 4px 0 0;
        color: #8aa88a;
        font: 12px/1.35 system-ui, sans-serif;
      }
      .journal-xp {
        height: 6px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .journal-skill-summary-bar {
        margin-top: 4px;
      }
      .journal-xp-fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #5a9a5a, #9fe830);
      }
      .journal-skill-subs {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #container-loot-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        padding: 16px;
        box-sizing: border-box;
        overflow: hidden;
      }
      #container-loot-overlay[hidden] {
        display: none;
      }
      #trader-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        padding: 16px;
        box-sizing: border-box;
        overflow: hidden;
      }
      #trader-overlay[hidden] {
        display: none;
      }
      #market-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        padding: 16px;
        box-sizing: border-box;
        overflow: hidden;
      }
      #market-overlay[hidden] {
        display: none;
      }
      .market-layout {
        width: min(920px, 100%);
      }
      .market-columns {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        width: 100%;
        align-items: stretch;
      }
      .market-panel {
        flex: 1 1 320px;
        max-width: none;
        width: auto;
        min-width: 0;
        max-height: min(78vh, 720px);
      }
      .inventory-panel.trader-panel.market-panel {
        display: flex;
        flex-direction: column;
        height: min(78vh, 720px);
        max-height: min(78vh, 720px);
        min-height: 0;
        overflow: hidden;
      }
      .market-panel .inventory-header,
      .market-panel .inventory-title {
        text-align: left;
      }
      .market-yours-body,
      .market-scroll {
        padding: 10px 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .inventory-panel.trader-panel.market-panel .market-yours-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .market-panel > .inventory-header,
      .market-board-search,
      .market-board-sort,
      .market-pager,
      .market-form,
      .market-desk {
        flex: 0 0 auto;
      }
      .market-scroll {
        overflow: auto;
      }
      .market-board-search {
        flex: 0 0 auto;
        margin: 10px 12px 0;
        font: inherit;
        color: #d4f0d4;
        background: rgba(8, 12, 8, 0.72);
        border: 1px solid rgba(100, 220, 100, 0.28);
        border-radius: 4px;
        padding: 6px 8px;
        color-scheme: dark;
      }
      .market-board-search:focus-visible {
        outline: 1px solid rgba(140, 220, 140, 0.75);
        outline-offset: 1px;
      }
      .market-board-search::-webkit-search-cancel-button {
        filter: invert(0.85);
      }
      .market-board-sort {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 12px 0;
      }
      .market-sort {
        font: inherit;
        color: #d4f0d4;
        background: rgba(8, 12, 8, 0.72);
        border: 1px solid rgba(100, 220, 100, 0.28);
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .market-sort--on {
        background: rgba(94, 200, 94, 0.16);
        border-color: rgba(140, 220, 140, 0.75);
      }
      .market-pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 12px 10px;
      }
      .market-pager[hidden] {
        display: none;
      }
      .market-page-label {
        font-size: 13px;
        opacity: 0.85;
      }
      .inventory-panel.trader-panel.market-panel > .market-scroll {
        flex: 1 1 auto;
        min-height: 0;
        max-height: none;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(120, 190, 120, 0.55) rgba(0, 0, 0, 0.35);
      }
      .inventory-panel.trader-panel.market-panel > .market-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .inventory-panel.trader-panel.market-panel > .market-scroll::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
      }
      .inventory-panel.trader-panel.market-panel > .market-scroll::-webkit-scrollbar-thumb {
        background: rgba(90, 150, 90, 0.55);
        border: 2px solid rgba(10, 14, 10, 0.98);
        border-radius: 4px;
      }
      .inventory-panel.trader-panel.market-panel .market-scroll--mine {
        flex: 1 1 auto;
        min-height: 0;
        max-height: none;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(120, 190, 120, 0.55) rgba(0, 0, 0, 0.35);
      }
      .inventory-panel.trader-panel.market-panel .market-scroll--mine::-webkit-scrollbar {
        width: 8px;
      }
      .inventory-panel.trader-panel.market-panel .market-scroll--mine::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
      }
      .inventory-panel.trader-panel.market-panel .market-scroll--mine::-webkit-scrollbar-thumb {
        background: rgba(90, 150, 90, 0.55);
        border: 2px solid rgba(10, 14, 10, 0.98);
        border-radius: 4px;
      }
      .market-row {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        padding: 0;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .market-row--expanded {
        border-color: rgba(100, 220, 100, 0.35);
      }
      .market-row-summary {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
        font: inherit;
      }
      .market-row-summary:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .market-row-summary:focus-visible {
        outline: 1px solid rgba(140, 220, 140, 0.75);
        outline-offset: -1px;
      }
      .market-row-icon {
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
      }
      .market-icon {
        width: 36px;
        height: 36px;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .market-row-name {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .market-row-qty,
      .market-row-price {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
      }
      .market-row-price {
        font-weight: 600;
      }
      .market-row-sold {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #f0d78c;
      }
      .market-row-chevron {
        flex: 0 0 auto;
        width: 1em;
        text-align: center;
        color: rgba(212, 240, 212, 0.7);
        font: 700 14px/1 system-ui, sans-serif;
      }
      .market-row-details {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        margin: 0 8px 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .market-row--yours {
        opacity: 0.48;
      }
      .market-row--yours .market-icon {
        filter: grayscale(1);
      }
      .market-fee {
        font-size: 13px;
        opacity: 0.85;
      }
      .market-hint {
        display: flex;
        flex-direction: column;
        gap: 2px;
        opacity: 1;
      }
      .market-row-qty,
      .market-row-meta,
      .market-hint,
      .market-cap,
      .market-desk-notes,
      .market-desk-returns,
      .market-desk-return,
      .market-empty {
        font-size: 13px;
        opacity: 0.85;
        margin: 0;
      }
      .market-form,
      .market-desk {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .market-form label,
      .market-field {

        color: #f4fbff;
        white-space: nowrap;
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.95),
          0 1px 2px rgba(0, 0, 0, 0.9),
          1px 0 0 rgba(0, 0, 0, 0.75),
          -1px 0 0 rgba(0, 0, 0, 0.75);
      }
      .map-poi-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f4fbff;
        border: 1.5px solid #16303c;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.85);
      }
      .map-quest-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }
      .map-quest-pin {
        position: absolute;
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        background: transparent;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: pointer;
      }
      .map-radio-pin .map-quest-pin-dot {
        background: #4ec8ff;
        border-color: #e8f7ff;
        transform: none;
        border-radius: 50%;
      }
      .map-quest-pin-dot {
        display: block;
        width: 10px;
        height: 10px;
        margin: 3px;
        background: #f0c040;
        border: 1.5px solid #fff6c8;
        transform: rotate(45deg);
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.85);
      }
      .map-quest-pin--offmap .map-quest-pin-dot {
        background: #c9a030;
        opacity: 0.9;
      }
      .map-quest-pin-tip {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 4px);
        transform: translate(-50%, 0);
        padding: 3px 7px;
        border-radius: 3px;
        background: rgba(10, 14, 10, 0.92);
        border: 1px solid rgba(240, 192, 64, 0.55);
        color: #fff4c8;
        font: 700 11px/1.2 system-ui, sans-serif;
        letter-spacing: 0.02em;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      }
      .map-quest-pin--below .map-quest-pin-tip {
        bottom: auto;
        top: calc(100% + 4px);
      }
      .map-quest-pin--right .map-quest-pin-tip {
        left: calc(100% + 6px);
        bottom: 50%;
        transform: translate(0, 50%);
      }
      .map-quest-pin--left .map-quest-pin-tip {
        left: auto;
        right: calc(100% + 6px);
        bottom: 50%;
        transform: translate(0, 50%);
      }
      .map-quest-pin:hover .map-quest-pin-tip,
      .map-quest-pin:focus-visible .map-quest-pin-tip,
      .map-quest-pin.is-open .map-quest-pin-tip {
        opacity: 1;
        visibility: visible;
      }

      /* ── Search progress overlay ────────────────────────────────────────── */
      #search-progress {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 60;
        background: rgba(10, 14, 10, 0.82);
        border: 1px solid rgba(100, 220, 100, 0.45);
        border-radius: 4px;
        padding: 12px 20px 14px;
        min-width: 200px;
        color: #d4f0d4;
        font: 14px/1.4 system-ui, sans-serif;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      #search-progress.search-progress--visible {
        opacity: 1;
      }
      #search-progress-label {
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
        color: #a0e8a0;

      #search-progress-track {
        height: 5px;

      /* ── Weapon hotbar ──────────────────────────────────────────────────── */
      #weapon-hotbar,

        position: fixed;
        bottom: var(--hud-bottom);

      #weapon-hotbar[hidden],

        display: none !important;

      #main-menu-weapon-hotbar.weapon-hotbar {
        position: static;
        left: auto;
        bottom: auto;
        transform: none;
        z-index: auto;
        max-width: none;
        width: 100%;
        pointer-events: none;
      }
      .weapon-hotbar-panel {
        background: rgba(10, 14, 10, 0.82);
        border: 1px solid rgba(100, 220, 100, 0.45);
        border-radius: 4px;
        padding: 8px 10px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);

      .weapon-hotbar-slots {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: clamp(4px, 1.5vw, 8px);
      }
      .weapon-hotbar-slot {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        width: 72px;
        min-height: 72px;
        aspect-ratio: 1;
        padding: 6px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(100, 220, 100, 0.22);
        border-radius: 4px;
        color: #d4f0d4;
        font: 12px/1.3 system-ui, sans-serif;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          transform 0.1s ease;
      }
      .weapon-hotbar-slot:hover {
        background: rgba(94, 200, 94, 0.1);
        border-color: rgba(100, 220, 100, 0.5);
      }
      .weapon-hotbar-slot:active {
        transform: scale(0.97);
      }
      .weapon-hotbar-slot--equipped {
        background: rgba(94, 200, 94, 0.14);
        border-color: rgba(100, 220, 100, 0.85);
        box-shadow: 0 0 0 1px rgba(94, 200, 94, 0.2);
      }
      .weapon-hotbar-slot--empty {
        opacity: 0.55;
        cursor: default;
      }
      .weapon-hotbar-slot--empty:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(100, 220, 100, 0.22);
      }
      .weapon-hotbar-key {
        position: absolute;
        top: 3px;
        left: 5px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7ecf7e;
        pointer-events: none;
        z-index: 1;
      }
      .weapon-hotbar-icon {
        width: 100%;
        height: 100%;
        max-width: 56px;
        max-height: 56px;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.65));
      }
      .weapon-hotbar-forbid {
        position: absolute;
        top: 3px;
        right: 3px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #e23b3b;
        background: rgba(28, 8, 8, 0.92);
        box-sizing: border-box;
        pointer-events: none;
        z-index: 2;
      }
      .weapon-hotbar-forbid::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 12px;
        background: #e23b3b;
        transform: translate(-50%, -50%) rotate(45deg);
      }
      .weapon-hotbar-name {
        font-size: clamp(10px, 2.5vw, 12px);
        font-weight: 600;
        text-align: center;
        color: #e8f8e8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .weapon-hotbar-ammo {
        position: absolute;
        left: 50%;
        bottom: 3px;
        transform: translateX(-50%);
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        color: #c8f0c8;
        letter-spacing: 0.02em;
        pointer-events: none;
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.95),
          0 1px 2px rgba(0, 0, 0, 0.9);
        z-index: 1;
      }
      .weapon-hotbar-slot > .inventory-cell-durability {
        z-index: 1;
      }

      /* ── Loot popup ─────────────────────────────────────────────────────── */

      .loot-card-header {

      .loot-item-icon-wrap {

        max-height: 100%;

        height: auto;

      .loot-item-name {
        color: #e8f8e8;

      .loot-item-qty {
        color: #7ecf7e;

      #radio-caption {
        position: fixed;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        z-index: 80;
        max-width: min(420px, 90vw);
        padding: 6px 10px;
        border-radius: 4px;
        background: rgba(10, 14, 10, 0.82);
        border: 1px solid rgba(78, 200, 255, 0.55);
        color: #e8f7ff;
        font: 600 13px/1.3 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #radio-caption.is-on {
        opacity: 1;

      #radio-caption.is-action {
        color: #b7bdb4;
        font-style: italic;
        font-size: 11px;
        font-weight: 500;
        border-color: rgba(160, 168, 156, 0.4);
      }
      .chat-bubble-icon {
        position: fixed;
        z-index: 1;
        margin: 0;
        pointer-events: none;
      }
      /* ── Chat bar ─────────────────────────────────────────────────────────── */
      #chat-bar {
        position: fixed;
        bottom: 18px;
        right: 18px;
        z-index: 80;
        display: flex;
        align-items: center;
        gap: 0;
        background: rgba(10, 14, 10, 0.82);
        border: 1px solid rgba(100, 220, 100, 0.45);
        border-radius: 4px;
        padding: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateY(6px);
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      #chat-bar.chat-bar--open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      #chat-input {
        background: transparent;
        border: none;
        outline: none;
        color: #d4f0d4;
        font: 14px/1.4 system-ui, sans-serif;

        caret-color: #7ecf7e;
      }
      #chat-input::placeholder {
        color: rgba(180, 220, 180, 0.45);
      }
      #chat-send {
        padding: 7px 10px 7px 0;
        margin: 0;
        border: none;
        background: transparent;
        font: 11px/1 system-ui, sans-serif;
        color: rgba(160, 200, 160, 0.55);
        letter-spacing: 0.04em;
        flex-shrink: 0;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #chat-send:active {
        color: #7ecf7e;
      }

      /* ── Main menu ──────────────────────────────────────────────────────── */
      #main-menu {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top, 0px)) 16px
          max(16px, env(safe-area-inset-bottom, 0px));
        background: #090c09;
        overflow: hidden;
        contain: paint;
      }
      #main-menu::before,
      #main-menu::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
      }
      #main-menu::before {
        width: 60vmax;
        height: 60vmax;
        left: 50%;
        top: -10%;
        transform: translateX(-50%);
        background: radial-gradient(circle, rgba(159, 232, 48, 0.16) 0%, transparent 70%);
        animation: menu-glow-drift 16s ease-in-out infinite;
      }
      #main-menu::after {
        width: 46vmax;
        height: 46vmax;
        right: -10%;
        bottom: -14%;
        background: radial-gradient(circle, rgba(20, 90, 130, 0.16) 0%, transparent 70%);
        animation: menu-glow-drift 16s ease-in-out infinite reverse;
      }
      @keyframes menu-glow-drift {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(3%, 4%) scale(1.08);
        }
      }
      .main-menu-panel {
        position: relative;
        z-index: 1;
        width: min(400px, 100%);
        background: linear-gradient(165deg, rgba(22, 28, 20, 0.86), rgba(9, 12, 9, 0.92));
        backdrop-filter: blur(24px) saturate(1.1);
        -webkit-backdrop-filter: blur(24px) saturate(1.1);
        border: 1px solid rgba(159, 232, 48, 0.16);
        border-radius: 20px;
        color: #d8ecd4;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 32px 64px rgba(0, 0, 0, 0.55),
          0 0 80px rgba(159, 232, 48, 0.06);
        overflow: hidden;
        animation: menu-panel-in 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes menu-panel-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #main-menu::before,
        #main-menu::after,
        .main-menu-panel {
          animation: none;
        }
      }
      .main-menu-header {
        padding: 32px 28px 20px;
        text-align: center;
        position: relative;
      }
      .main-menu-header::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 64px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(159, 232, 48, 0.5),
          transparent
        );
      }
      /* Match deadtiles.com header wordmark */
      .main-menu-title,
      .boot-loading-brand {
        font-family: Oswald, sans-serif;
        font-style: normal;
        font-weight: 400;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #f4f4f5;
      }
      .main-menu-title {
        margin: 0;
        font-size: clamp(26px, 5vw, 32px);
        line-height: 1.1;
        padding-left: 0.28em; /* optical center with letter-spacing */
      }
      .brand-tiles {
        color: #9fe830;
        text-shadow:
          0 0 18px hsla(84, 80%, 55%, 0.55),
          0 0 40px hsla(84, 80%, 45%, 0.35);

      }
      @keyframes flicker {
        0%,
        100% {
          opacity: 1;
        }
        8% {
          opacity: 0.35;
        }
        10% {
          opacity: 1;
        }
        62% {
          opacity: 1;
        }
        64% {
          opacity: 0.5;
        }
        66% {
          opacity: 1;
        }
      }
      .main-menu-subtitle {

        font-weight: 400;
        color: rgba(158, 216, 158, 0.72);

      .main-menu-body {

        flex-direction: column;

      .main-menu-preview {

      .main-menu-preview-avatar {

      .main-menu-play[hidden],
      .main-menu-sign-out[hidden],
      .main-menu-status[hidden] {
        display: none !important;
      }
      .main-menu-field-hint {
        font-size: 11px;
        color: rgba(126, 170, 126, 0.85);
      }
      .main-menu-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(158, 216, 158, 0.7);
      }
      .main-menu-input {
        border: 1px solid rgba(159, 232, 48, 0.18);
        border-radius: 10px;
        padding: 12px 14px;
        font: 15px/1.2 "Segoe UI", system-ui, sans-serif;
        color: #e8f4e8;
        background: rgba(0, 0, 0, 0.25);
        outline: none;
        caret-color: #9fe830;
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }
      .main-menu-input::placeholder {
        color: rgba(180, 220, 180, 0.35);
      }
      .main-menu-input:focus {
        border-color: rgba(159, 232, 48, 0.5);
        background: rgba(159, 232, 48, 0.06);
        box-shadow: 0 0 0 3px rgba(159, 232, 48, 0.12);
      }
      .main-menu-input:disabled {
        opacity: 0.55;
      }
      .main-menu-play {
        position: relative;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        font-family: Oswald, sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #0e1a0e;
        background: linear-gradient(135deg, #b4f04a, #82ce1e);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.25) inset,
          0 10px 24px rgba(130, 206, 30, 0.22);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }
      .main-menu-play:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.3) inset,
          0 14px 30px rgba(130, 206, 30, 0.32);
        filter: brightness(1.04);
      }
      .main-menu-play:active:not(:disabled) {
        transform: translateY(0);
        filter: brightness(0.98);
      }
      .main-menu-play:disabled {
        opacity: 0.5;
        cursor: default;
        filter: none;
        transform: none;
        box-shadow: none;
      }
      .main-menu-sign-out {
        border: none;
        border-radius: 10px;
        padding: 8px 12px;
        font: 12px/1.2 "Segoe UI", system-ui, sans-serif;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(158, 180, 158, 0.7);
        background: transparent;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease;
      }
      .main-menu-sign-out:hover:not(:disabled) {
        color: #d4f0d4;
        background: rgba(255, 255, 255, 0.04);
      }
      .main-menu-sign-out:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .main-menu-status {
        text-align: center;
        font-size: 12px;
        color: rgba(160, 232, 160, 0.9);
        min-height: 1.2em;
        transition: color 0.15s ease;
      }
      .main-menu-status--error {
        color: #f0a0a0;
      }
      .main-menu-hint {
        text-align: center;
        font-size: 11px;
        color: rgba(126, 170, 126, 0.5);
        line-height: 1.5;
        letter-spacing: 0.02em;
      }
      .main-menu-hint span {
        color: rgba(158, 216, 158, 0.85);
        font-weight: 600;
      }
      .main-menu-wallet-hint {
        text-align: center;
        font: 12px/1.45 "Segoe UI", system-ui, sans-serif;
        color: rgba(158, 180, 158, 0.78);
      }
      .main-menu-wallet-hint[hidden] {
        display: none !important;
      }
      .main-menu-wallet-hint a {
        color: #9fe830;
        font-weight: 600;
        text-decoration: none;
      }
      .main-menu-wallet-hint a:hover {
        text-decoration: underline;
      }
      .wallet-picker {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        align-items: safe center;
        justify-content: center;
        padding: 16px;
        background: rgba(5, 8, 5, 0.72);
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .wallet-picker-panel {
        width: min(340px, 100%);
        margin-block: 0;
        padding: 20px 18px 16px;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
        border-radius: 16px;
        background: linear-gradient(165deg, rgba(22, 28, 20, 0.96), rgba(9, 12, 9, 0.98));
        border: 1px solid rgba(159, 232, 48, 0.16);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      }
      .wallet-picker-title {
        margin: 0 0 6px;
        font-family: Oswald, sans-serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
        color: #f4f4f5;
      }
      .wallet-picker-hint {
        margin: 0 0 14px;
        text-align: center;
        font: 12px/1.4 "Segoe UI", system-ui, sans-serif;
        color: rgba(158, 180, 158, 0.7);
      }
      .wallet-picker-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .wallet-picker-option {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid rgba(159, 232, 48, 0.12);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        color: #d8ecd4;
        font: 15px/1.2 "Segoe UI", system-ui, sans-serif;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
      }
      .wallet-picker-option:hover,
      .wallet-picker-option:focus-visible {
        border-color: rgba(159, 232, 48, 0.4);
        background: rgba(159, 232, 48, 0.08);
        outline: none;
      }
      .wallet-picker-option--last {
        border-color: rgba(159, 232, 48, 0.28);
      }
      .wallet-picker-option--action {
        justify-content: center;
        font-weight: 600;
      }
      .wallet-picker-option--primary {
        border-color: rgba(159, 232, 48, 0.4);
        background: rgba(159, 232, 48, 0.1);
        color: #e8ffb8;
      }
      .wallet-picker-option--pending {
        opacity: 0.55;
        pointer-events: none;
        cursor: default;
      }
      .wallet-picker-icon,
      .wallet-picker-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        flex: 0 0 auto;
      }
      .wallet-picker-icon {
        object-fit: cover;
        background: #111;
      }
      .wallet-picker-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(159, 232, 48, 0.16);
        color: #9fe830;
        font-weight: 700;
      }
      .wallet-picker-name {
        flex: 1 1 auto;
      }
      .wallet-picker-last {
        flex: 0 0 auto;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(159, 232, 48, 0.8);
      }
      .wallet-picker-cancel {
        display: block;
        width: 100%;
        margin-top: 12px;
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font: 12px/1.2 "Segoe UI", system-ui, sans-serif;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(158, 180, 158, 0.7);
        background: transparent;
        cursor: pointer;
      }
      .wallet-picker-cancel:hover {
        color: #d4f0d4;
        background: rgba(255, 255, 255, 0.04);
      }
      body.main-menu-open #player-hud,
      body.main-menu-open #chat-bar,
      body.main-menu-open #weapon-hotbar,
      body.main-menu-open #world-clock {
        display: none !important;
      }
      body:not(.game-ready) #player-hud,
      body:not(.game-ready) #chat-bar,
      body:not(.game-ready) #weapon-hotbar,
      body:not(.game-ready) #search-progress,
      body:not(.game-ready) #map-overlay,
      body:not(.game-ready) #mobile-hud-stack,
      body:not(.game-ready) #world-clock {
        visibility: hidden;
      }
      /* Keep the Phaser canvas blank until nearby NPC packs are ready. */
      body:not(.game-ready) #game {
        visibility: hidden;
        pointer-events: none;
      }

      /* Boot loader — visible before Phaser/JS finishes */
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(40, 70, 40, 0.35) 0%, transparent 55%),
          rgba(8, 12, 8, 0.88);
        color: #d4f0d4;
        font-family: system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #boot-loading.boot-loading--done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* Join gate — same look, shown again when entering the world room */
      #world-entering {
        position: fixed;
        inset: 0;
        z-index: 190;
        display: none;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(40, 70, 40, 0.35) 0%, transparent 55%),
          rgba(8, 12, 8, 0.92);
        color: #d4f0d4;
        font-family: system-ui, sans-serif;
      }
      body.world-entering #world-entering {
        display: flex;
      }
      .boot-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }
      .boot-loading-brand {
        font-size: clamp(1.75rem, 5vw, 2.4rem);
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
      }
      .boot-loading-spinner {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(160, 232, 160, 0.18);
        border-top-color: #8fd48f;
        animation: boot-spin 0.85s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .boot-loading-status {
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        color: #9bb89b;
        min-height: 1.2em;
      }
      .boot-loading-bar {
        width: min(240px, 60vw);
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .boot-loading-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, #5a9a5a, #a0e8a0);
        transition: width 0.12s ease-out;
      }
      .boot-loading-pct {
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.06em;
        color: #7a9a7a;
      }

      /* ── Action HUD button stack (Reload / Build / Map / Inv) — bottom-right ─ */
      #mobile-hud-stack,
      .mobile-hud-btn {
        display: none;
      }
      body.game-ready:not(.main-menu-open) #mobile-hud-stack {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--mobile-action-gap, 8px);
        position: fixed;
        right: max(12px, env(safe-area-inset-right, 0px));
        bottom: var(--hud-bottom);
        z-index: 70;
      }
      .mobile-hud-group {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--mobile-action-gap, 8px);
      }
      .mobile-hud-group:not(:has(.mobile-hud-btn:not([hidden]))) {
        display: none;
      }
      /* Menus above, fight buttons in the thumb zone. Desktop keeps source order. */
      body.is-mobile.game-ready:not(.main-menu-open) #mobile-hud-stack {
        flex-direction: column-reverse;
        align-items: flex-end;
        gap: calc(var(--mobile-action-gap, 8px) + 6px);
      }
      body.is-mobile.game-ready:not(.main-menu-open) .mobile-hud-group {
        align-items: flex-end;
      }
      body.is-mobile.game-ready:not(.main-menu-open)
        #mobile-hud-stack
        .mobile-hud-btn--utility {
        width: var(--mobile-utility-size, 44px);
        height: var(--mobile-utility-size, 44px);
        border-radius: calc(var(--mobile-utility-size, 44px) * 0.18);
      }
      body.is-mobile.game-ready:not(.main-menu-open)
        #mobile-hud-stack
        .mobile-hud-btn--utility
        .mobile-hud-btn-icon {
        width: 62%;
        height: 62%;
      }
      body.game-ready:not(.main-menu-open) #mobile-hud-stack .mobile-hud-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--mobile-action-size, 56px);
        height: var(--mobile-action-size, 56px);
        padding: 0;
        border: 1px solid rgba(100, 220, 100, 0.55);
        border-radius: calc(var(--mobile-action-size, 56px) * 0.18);
        background: rgba(10, 14, 10, 0.88);
        color: #e8f8e8;
        font: 700 13px/1 system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      body.game-ready:not(.main-menu-open) #mobile-hud-stack .mobile-hud-btn[hidden] {
        display: none !important;
      }
      body.game-ready:not(.main-menu-open) #mobile-hud-stack .mobile-hud-btn-icon {
        width: calc(var(--mobile-action-size, 56px) * 0.62);
        height: calc(var(--mobile-action-size, 56px) * 0.62);
        object-fit: contain;
        pointer-events: none;
        image-rendering: auto;
      }
      body.game-ready:not(.main-menu-open) #mobile-hud-stack .mobile-hud-btn:active {
        transform: scale(0.96);
        background: rgba(94, 200, 94, 0.22);
      }
      body.inventory-open #mobile-inventory-btn,
      body.journal-open #mobile-journal-btn,
      body.map-open #mobile-map-btn,
      body.chat-open #mobile-chat-btn,
      body.build-mode-open #mobile-build-btn,
      body.game-ready:not(.main-menu-open)
        #mobile-hud-stack
        .mobile-hud-btn--active {
        border-color: rgba(100, 220, 100, 0.85);
        background: rgba(94, 200, 94, 0.2);
      }
      body.chat-open #mobile-hud-stack {
        opacity: 0;
        pointer-events: none;
      }

      /* Thumb stick: bottom-left on phones. Hidden until the world is in play. */
      #move-stick {
        display: none;
        position: fixed;
        left: max(12px, env(safe-area-inset-left, 0px));
        bottom: var(--hud-bottom);
        z-index: 70;
        width: var(--move-stick-size, 120px);
        height: var(--move-stick-size, 120px);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        transition: opacity 0.16s ease;
      }
      body.is-mobile {
        --move-stick-size: clamp(96px, 30vw, 128px);
        --move-stick-gap: 8px;
        --mobile-utility-size: 44px;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #move-stick {
        display: block;
      }
      /* Faded until the thumb is on it, then solid. */
      body.is-mobile.game-ready:not(.main-menu-open):not(.chat-open)
        #move-stick:not(.move-stick--blocked):not(.move-stick--active) {
        opacity: 0.55;
      }
      body.is-mobile.game-ready:not(.main-menu-open):not(.chat-open)
        #move-stick.move-stick--active:not(.move-stick--blocked) {
        opacity: 1;
      }
      body.chat-open #move-stick,
      #move-stick.move-stick--blocked {
        opacity: 0;
        pointer-events: none;
      }
      .move-stick-base {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid rgba(100, 220, 100, 0.45);
        background: rgba(10, 14, 10, 0.45);
        box-shadow: inset 0 0 0 10px rgba(10, 14, 10, 0.28);
      }
      .move-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 42%;
        height: 42%;
        margin-left: -21%;
        margin-top: -21%;
        border-radius: 50%;
        border: 2px solid rgba(160, 230, 160, 0.85);
        background: rgba(94, 200, 94, 0.55);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }
      #move-stick.move-stick--sprint .move-stick-knob {
        border-color: rgba(255, 176, 64, 0.95);
        background: rgba(255, 150, 40, 0.62);
      }
      #move-stick.move-stick--sprint .move-stick-base {
        border-color: rgba(255, 176, 64, 0.7);
      }

      /* Mobile in-game HUD: stats top-left, stick bottom-left, hotbar between stick and actions */
      body.is-mobile.game-ready:not(.main-menu-open) #world-clock {
        top: max(10px, env(safe-area-inset-top, 0px));
        left: auto;
        right: max(10px, env(safe-area-inset-right, 0px));
        transform: none;
        font-size: 12px;
        padding: 5px 10px;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #player-hud {
        top: max(10px, env(safe-area-inset-top, 0px));
        bottom: auto;
        left: max(10px, env(safe-area-inset-left, 0px));
        gap: 8px;
        transform: scale(0.88);
        transform-origin: top left;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #player-avatar {
        width: 56px;
        height: 56px;
      }
      body.is-mobile.game-ready:not(.main-menu-open) .player-bar-label {
        display: none;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #player-bars {
        gap: 4px;
      }
      body.is-mobile.game-ready:not(.main-menu-open) .player-bar-row {
        gap: 0;
      }
      body.is-mobile.game-ready:not(.main-menu-open) .player-bar-track {
        width: 96px;
        height: 6px;
        min-height: 6px;
        max-height: 6px;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #weapon-hotbar {
        bottom: var(--hud-bottom);
        left: calc(
          max(12px, env(safe-area-inset-left, 0px)) + var(--move-stick-size, 120px) +
            var(--move-stick-gap, 8px)
        );
        right: calc(
          max(12px, env(safe-area-inset-right, 0px)) + var(--mobile-action-size, 56px) +
            var(--move-stick-gap, 8px)
        );
        width: auto;
        transform: none;
        max-width: none;
        display: flex;
        justify-content: center;
        align-items: flex-end;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #weapon-hotbar .weapon-hotbar-panel {
        width: max-content;
        max-width: 100%;
        padding: 4px 6px;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #weapon-hotbar .weapon-hotbar-slot {
        width: 52px;
        max-width: 52px;
        min-width: 0;
        flex: 1 1 44px;
        min-height: 52px;
        padding: 4px;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #weapon-hotbar .weapon-hotbar-icon {
        max-width: 40px;
        max-height: 40px;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #weapon-hotbar .weapon-hotbar-name {
        display: none;
      }
      body.is-mobile .weapon-hotbar-key {
        display: none;
      }
      body.is-mobile.game-ready:not(.main-menu-open) #loot-popup-container {
        bottom: calc(var(--hud-bottom) + var(--move-stick-size, 120px) + 12px);
      }

      /* Center dialogs when they fit. Overflow uses .dialog-overflows (top + scroll). */
      #inventory-overlay,
      #market-overlay,
      #container-loot-overlay,
      #red-order-dialog-overlay,
      #ashen-dialog-overlay,
      #ashen-militia-dialog-overlay,
      #faction-attack-warning-overlay,
      #death-screen-overlay,
      #door-code-overlay,
      #craft-overlay,
      #fireplace-overlay,
      #prefab-overlay,
      #deconstruct-overlay,
      #map-overlay,
      .wallet-picker,
      .trader-qty-modal {
        align-items: center;
        align-items: safe center;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #main-menu {
        align-items: center;
      }
      #main-menu.dialog-overflows {
        overflow-x: hidden;
        overflow-y: auto;
      }
      .dialog-overflows {
        align-items: flex-start !important;
      }

      /* ── Mobile / narrow responsive overlays ────────────────────────────── */
      @media (max-width: 720px), (pointer: coarse) and (max-width: 960px) {
        /* Non-mobile narrow: keep compact sizing; true mobile uses body.is-mobile rules above */
        body:not(.is-mobile) #player-hud {
          bottom: max(10px, env(safe-area-inset-bottom, 0px));
          left: max(10px, env(safe-area-inset-left, 0px));
          gap: 8px;
          transform: scale(0.88);
          transform-origin: bottom left;
        }
        body:not(.is-mobile) #player-avatar {
          width: 56px;
          height: 56px;
        }
        body:not(.is-mobile) .player-bar-track {
          width: 96px;
        }

        body:not(.is-mobile) #weapon-hotbar {
          bottom: max(76px, calc(env(safe-area-inset-bottom, 0px) + 64px));
          max-width: min(280px, calc(100vw - 120px));
        }
        #weapon-hotbar .weapon-hotbar-slot,
        .weapon-hotbar-slot {
          width: 56px;
          min-height: 56px;
          padding: 4px;
        }
        #weapon-hotbar .weapon-hotbar-icon,
        .weapon-hotbar-icon {
          max-width: 40px;
          max-height: 40px;
        }
        #weapon-hotbar .weapon-hotbar-name,
        .weapon-hotbar-name {
          display: none;
        }

        /* Chat stays hidden until opened via the mobile Chat button / Enter */
        #chat-bar:not(.chat-bar--open) {
          display: none !important;
        }
        #chat-bar.chat-bar--open {
          display: flex !important;
          left: max(12px, env(safe-area-inset-left, 0px));
          right: max(12px, env(safe-area-inset-right, 0px));
          bottom: var(--hud-bottom);
          width: auto;
        }
        #chat-input {
          width: 100%;
          min-width: 0;
          flex: 1;
          font-size: 16px; /* avoid iOS zoom on focus */
        }
        #chat-send {
          padding: 10px 14px;
          font: 700 12px/1 system-ui, sans-serif;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: #7ecf7e;
        }

        #loot-popup-container {
          bottom: 150px;
          max-width: calc(100vw - 24px);
        }
        .loot-card {
          min-width: 0;
          width: min(240px, 90vw);
          padding: 8px 12px;
          font-size: 13px;
        }

        #inventory-overlay,
        #container-loot-overlay,
        #trader-overlay,
        #red-order-dialog-overlay,
        #ashen-dialog-overlay,
        #ashen-militia-dialog-overlay,
        #faction-attack-warning-overlay,
        #death-screen-overlay,
        #map-overlay,
        #craft-overlay,
        #fireplace-overlay,
        #prefab-overlay,
        #deconstruct-overlay,
        #door-code-overlay {
          /* Center when the sheet fits. .dialog-overflows pins overflow to the top. */
          align-items: center;
          align-items: safe center;
          justify-content: center;
          /* Double the previous 12/10 margins, plus safe-area insets. */
          padding: calc(24px + env(safe-area-inset-top, 0px))
            calc(20px + env(safe-area-inset-right, 0px))
            calc(24px + env(safe-area-inset-bottom, 0px))
            calc(20px + env(safe-area-inset-left, 0px));
          box-sizing: border-box;
          overflow-x: hidden;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }
        #onboarding-overlay,
        #onboarding-controls-legend {
          padding: calc(24px + env(safe-area-inset-top, 0px))
            calc(20px + env(safe-area-inset-right, 0px))
            calc(24px + env(safe-area-inset-bottom, 0px))
            calc(20px + env(safe-area-inset-left, 0px));
          box-sizing: border-box;
          overflow-x: hidden;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }
        /* Keep trader overlay a flex host even when shown after [hidden] */
        #trader-overlay:not([hidden]),
        #red-order-dialog-overlay:not([hidden]),
        #ashen-dialog-overlay:not([hidden]),
        #ashen-militia-dialog-overlay:not([hidden]),
        #faction-attack-warning-overlay:not([hidden]),
        #death-screen-overlay:not([hidden]),
        #inventory-overlay:not([hidden]),
        #journal-overlay:not([hidden]),
        #container-loot-overlay:not([hidden]),
        #map-overlay:not([hidden]),
        #craft-overlay:not([hidden]),
        #fireplace-overlay:not([hidden]),
        #prefab-overlay:not([hidden]),
        #deconstruct-overlay:not([hidden]),
        #door-code-overlay:not([hidden]),
        #onboarding-controls-legend:not([hidden]) {
          display: flex;
        }

        .inventory-panel:not(.trader-panel):not(.container-loot-panel):not(.craft-panel):not(.fireplace-panel):not(.journal-panel) {
          width: min(420px, 100%);
          /* Fill the padded overlay when content needs it (inventory). */
          max-height: 100%;
          min-height: 0;
          margin-block: 0;
          overflow: hidden;
        }
        .inventory-panel.journal-panel {
          width: min(440px, 100%);
          max-height: min(78vh, 100%);
          min-height: 0;
          overflow: hidden;
        }
        .inventory-header {
          padding: 12px 12px 8px;
          flex: 0 0 auto;
        }
        .inventory-grid-wrap {
          padding: 10px 12px;
          overflow-y: auto;
          flex: 1 1 auto;
          min-height: 0;
          max-height: none;
          -webkit-overflow-scrolling: touch;
        }
        .inventory-grid {
          gap: 6px;
        }
        .inventory-cell {
          min-height: 56px;
          padding: 4px;
          font-size: 10px;
        }
        .fireplace-fuel-cell {
          flex: 0 0 56px;
          width: 56px;
          height: 56px;
          min-width: 56px;
          min-height: 56px;
        }
        .inventory-cell-icon {
          max-width: 40px;
          max-height: 40px;
        }
        .inventory-footer {
          padding: 8px 12px 12px;
          flex: 0 0 auto;
        }
        .inventory-action-btn {
          min-width: 64px;
          padding: 10px 12px;
          font-size: 13px;
        }
        .dialog-close-btn {
          padding: 10px 14px;
          font-size: 13px;
          min-height: 40px;
        }

        .container-loot-layout {
          flex-direction: column;
          flex-wrap: nowrap;
          align-items: stretch;
          width: min(420px, 100%);
          gap: 10px;
          max-height: none;
          min-height: 0;
          margin-block: 0;
          overflow: visible;
        }
        #container-loot-overlay {
          touch-action: pan-y;
        }
        .container-loot-layout .container-loot-panel {
          width: 100%;
          max-width: none;
          flex: 0 0 auto;
          max-height: none;
        }
        .container-loot-layout .inventory-grid-wrap {
          max-height: none;
          overflow: visible;
        }
        .container-loot-layout .inventory-grid--weapons {
          width: calc((100% - 24px) / 2 + 8px);
        }

        .trader-layout {
          width: min(420px, 100%);
          max-height: 100%;
          min-height: 0;
          margin-block: 0;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .trader-columns {
          flex-direction: column;
          flex: 1 1 0%;
          min-height: 0;
          width: 100%;
          gap: 10px;
          overflow: hidden;
        }
        .red-dialog-layout {
          width: min(420px, 100%);
          max-height: none;
          min-height: 0;
          margin-block: 0;
          overflow: visible;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .red-dialog-columns {
          flex-direction: column;
          flex: 0 0 auto;
          min-height: 0;
          width: 100%;
          gap: 10px;
          overflow: visible;
        }
        /* Same collapse fix as .trader-panel: desktop flex:1 + inventory-panel
           overflow:hidden zeros panel height in a mobile column layout. */
        .inventory-panel.red-dialog-panel {
          width: 100%;
          max-width: none;
          flex: 0 0 auto;
          height: auto;
          max-height: none;
          min-height: 0;
          overflow: visible;
          margin-block: 0;
        }
        .red-dialog-panel .red-dialog-body {
          flex: 0 0 auto;
          min-height: 0;
          max-height: none;
          overflow: visible;
        }
        .inventory-panel.trader-panel:not(.market-panel) {
          width: 100%;
          max-width: none;
          flex: 1 1 0%;
          height: auto;
          max-height: 100%;
          min-height: 0;
          overflow: hidden;
        }
        #trader-overlay .inventory-grid-wrap.trader-grid-wrap {
          flex: 1 1 0%;
          max-height: none;
          overflow-x: hidden;
          overflow-y: auto;
          min-height: 0;
        }
        #trader-overlay .trader-cell-step {
          opacity: 1;
        }
        #trader-overlay .trader-cell-step-btn {
          pointer-events: auto;
          width: 28px;
          height: 28px;
        }
        #trader-overlay {
          overflow: hidden;
          flex-direction: column;
          touch-action: pan-y;
        }
        .trader-footer {
          flex: 0 1 auto;
          max-height: 38%;
        }

        .craft-layout,
        .fireplace-layout,
        .door-code-panel,
        .death-screen-panel,
        .faction-attack-warning-panel,
        .onboarding-legend-panel,
        .onboarding-panel,
        .trader-qty-panel {
          margin-block: 0;
        }
        .trader-qty-modal {
          align-items: center;
          align-items: safe center;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }
        .map-panel {
          width: min(420px, 100%);
          max-height: none;
          margin-block: 0;
          overflow: visible;
        }
        .map-frame {
          margin: 10px;
        }

        #main-menu {
          align-items: center;
          overflow: hidden;
        }
        #main-menu.dialog-overflows {
          overflow-x: hidden;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }
        .wallet-picker {
          align-items: center;
          align-items: safe center;
        }
        .main-menu-panel {
          width: min(400px, 100%);
          margin-block: 0;
          border-radius: 16px;
        }
        .main-menu-header {
          padding: 22px 20px 16px;
        }
        .main-menu-title {
          font-size: 24px;
        }
        .main-menu-subtitle {
          font-size: 10px;
          letter-spacing: 0.1em;
        }
        .main-menu-body {
          padding: 0 20px 22px;
          gap: 16px;
        }
        .main-menu-preview {
          padding: 12px;
          gap: 12px;
        }
        .main-menu-survivor-name {
          font-size: 17px;
        }
        .main-menu-preview-avatar {
          width: 56px;
          height: 56px;
        }
        .main-menu-preview-hotbar .weapon-hotbar-slot {
          width: 46px;
          min-height: 46px;
        }
        .main-menu-play {
          padding: 14px 16px;
          font-size: 14px;
        }
        .main-menu-sign-out {
          padding: 10px 12px;
          font-size: 12px;
        }

        #search-progress {
          min-width: min(200px, 80vw);
          padding: 10px 16px 12px;
        }
      }

      /* Extra-narrow phones */
      @media (max-width: 400px) {
        .inventory-cell {
          min-height: 48px;
        }
        .fireplace-fuel-cell {
          flex: 0 0 48px;
          width: 48px;
          height: 48px;
          min-width: 48px;
          min-height: 48px;
        }
        .inventory-grid--weapons {
          max-width: 100%;
        }
        body {
          --mobile-action-size: 52px;
        }
        body.game-ready:not(.main-menu-open) #mobile-hud-stack .mobile-hud-btn {
          font-size: 12px;
        }
      }

      /*
        Phone landscape is short. Four smaller menu buttons sit above two fight
        buttons (4 * 0.75 + 2 = 5 action-sized slots). Tablets taller than 540px
        keep the portrait sizes.
      */
      @media (orientation: landscape) and (max-height: 540px) {
        body.is-mobile {
          --landscape-hud-height: 100vh;
          --landscape-hud-height: 100lvh;
          --mobile-action-gap: 4px;
          --mobile-action-size: clamp(
            40px,
            calc(
              (
                var(--landscape-hud-height) - var(--hud-bottom) -
                  max(4px, env(safe-area-inset-top, 0px)) - 4px -
                  (5 * var(--mobile-action-gap)) - 6px
              ) / 5
            ),
            56px
          );
          --mobile-utility-size: calc(var(--mobile-action-size) * 0.75);
          --move-stick-size: clamp(80px, calc(var(--mobile-action-size) * 2.2), 112px);
        }
        body.is-mobile.game-ready:not(.main-menu-open) #world-clock {
          left: 50%;
          right: auto;
          transform: translateX(-50%);
        }
        body.is-mobile.game-ready:not(.main-menu-open) #weapon-hotbar .weapon-hotbar-slot {
          width: var(--mobile-action-size);
          max-width: var(--mobile-action-size);
          min-height: var(--mobile-action-size);
          flex-basis: var(--mobile-action-size);
        }
        body.is-mobile.game-ready:not(.main-menu-open) #weapon-hotbar .weapon-hotbar-icon {
          max-width: 70%;
          max-height: 70%;
        }
        body.is-mobile.game-ready:not(.main-menu-open) #player-hud {
          transform: scale(0.78);
        }
      }

      /* APK / phone: overlay is the only scroller. */
      body.is-mobile #container-loot-overlay:not([hidden]),
      body.is-mobile #journal-overlay:not([hidden]),
      body.is-mobile #red-order-dialog-overlay:not([hidden]),
      body.is-mobile #ashen-dialog-overlay:not([hidden]),
      body.is-mobile #ashen-militia-dialog-overlay:not([hidden]) {
        align-items: center;
        align-items: safe center;
        justify-content: center;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      body.is-mobile .container-loot-layout,
      body.is-mobile .red-dialog-layout {
        margin-block: 0;
        max-height: none;
        overflow: visible;
      }
      body.is-mobile #trader-overlay:not([hidden]) {
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
      }
      body.is-mobile #trader-overlay .trader-layout {
        flex: 1 1 0%;
        width: 100%;
        height: 100%;
        max-height: 100%;
        min-height: 0;
        margin-block: 0;
        overflow: hidden;
      }
      body.is-mobile #trader-overlay .trader-cell-step {
        opacity: 1;
      }
      body.is-mobile #trader-overlay .trader-cell-step-btn {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="boot-loading" aria-live="polite" aria-busy="true">
      <div class="boot-loading-inner">
        <div class="boot-loading-brand">DEAD<span class="brand-tiles">TILES</span></div>
        <div class="boot-loading-spinner" aria-hidden="true"></div>
        <div class="boot-loading-status" id="boot-loading-status">Starting…</div>
        <div class="boot-loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="boot-loading-bar">
          <div class="boot-loading-bar-fill" id="boot-loading-fill"></div>
        </div>
        <div class="boot-loading-pct" id="boot-loading-pct">0%</div>
      </div>
    </div>
    <div id="world-entering" hidden aria-live="polite" aria-busy="false">
      <div class="boot-loading-inner">
        <div class="boot-loading-brand">DEAD<span class="brand-tiles">TILES</span></div>
        <div class="boot-loading-spinner" aria-hidden="true"></div>
        <div class="boot-loading-status" id="world-entering-status">Entering world…</div>
      </div>
    </div>
    <div id="world-clock" hidden aria-label="Time of day">
      <div id="world-clock-time"></div>
    </div>
    <div id="hud"><div id="status"></div></div>
    <div id="player-hud">
      <div id="player-avatar"><img src="/assets/UI/PlayerMan1/PlayerMan1_Avatar.png" alt="Avatar" /></div>
      <div id="player-bars">
        <div class="player-bar-row">
          <span class="player-bar-label" id="health-label">Health</span>
          <div class="player-bar-track" id="health-track"><div id="health-cap"></div><div id="health-lost"></div><div id="health-fill" class="player-bar-fill" style="width:100%"></div></div>
        </div>
        <div class="player-bar-row">
          <span class="player-bar-label" id="stamina-label">Stamina</span>
          <div class="player-bar-track" id="stamina-track"><div id="stamina-fill" class="player-bar-fill" style="width:100%"></div></div>
        </div>
        <div class="player-bar-row">
          <span class="player-bar-label" id="hunger-label">Hunger</span>
          <div class="player-bar-track" id="hunger-track"><div id="hunger-fill" class="player-bar-fill" style="width:100%"></div></div>
        </div>
        <div class="player-bar-row">
          <span class="player-bar-label" id="thirst-label">Thirst</span>
          <div class="player-bar-track" id="thirst-track"><div id="thirst-fill" class="player-bar-fill" style="width:100%"></div></div>
        </div>
        <div class="player-bar-row">
          <span class="player-bar-label" id="temp-label">Temp</span>
          <div class="player-bar-track" id="temp-track"><div id="temp-fill" class="player-bar-fill" style="width:56%"></div></div>
        </div>
      </div>
    </div>
    <div id="temperature-fx" aria-hidden="true"></div>
    <div id="infection-fx" aria-hidden="true"></div>
    <div id="game"></div>
    <div id="chat-bar">
      <input id="chat-input" type="text" maxlength="120" placeholder="Type a message…" autocomplete="off" spellcheck="false" enterkeyhint="send" />
      <button type="button" id="chat-send" aria-label="Send message">Enter ↵</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
