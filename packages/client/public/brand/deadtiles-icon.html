<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Oswald";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("Oswald-Regular.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      .badge {
        position: relative;
        width: 1024px;
        height: 1024px;
        border-radius: 50%;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse 58% 50% at 63% 46%,
            hsla(84, 80%, 45%, 0.22),
            transparent 64%
          ),
          radial-gradient(circle at 50% 44%, #121412 0%, #070808 74%);
        box-shadow:
          inset 0 28px 60px rgba(255, 255, 255, 0.04),
          inset 0 -90px 140px rgba(0, 0, 0, 0.42);
        display: grid;
        place-items: center;
      }
      .mark {
        margin: 0;
        font-family: Oswald, sans-serif;
        font-style: normal;
        font-weight: 400;
        font-size: 520px;
        line-height: 1;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #f4f4f5;
        padding-left: 0.05em;
        transform: translateY(-3%);
        white-space: nowrap;
      }
      .tiles {
        color: #9fe830;
        text-shadow:
          0 0 10px hsla(84, 80%, 55%, 0.95),
          0 0 28px hsla(84, 80%, 55%, 0.75),
          0 0 64px hsla(84, 80%, 45%, 0.5),
          0 0 110px hsla(84, 80%, 40%, 0.32);
      }
    </style>
  </head>
  <body>
    <div class="badge">
      <h1 class="mark">D<span class="tiles">T</span></h1>
    </div>
  </body>
</html>
