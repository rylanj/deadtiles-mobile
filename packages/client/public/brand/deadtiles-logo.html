<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Oswald";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("Oswald-Regular.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1536px;
        height: 1536px;
        overflow: hidden;
        background: #070808;
      }
      .scene {
        position: relative;
        width: 1536px;
        height: 1536px;
        background: url("deadtiles-logo-bg.png") center / cover no-repeat;
      }
      .scene::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 42% at 62% 52%, hsla(84, 80%, 45%, 0.16), transparent 70%),
          radial-gradient(ellipse 90% 70% at 50% 50%, transparent 35%, rgba(0, 0, 0, 0.55) 100%);
        pointer-events: none;
      }
      .wordmark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -54%);
        margin: 0;
        font-family: Oswald, sans-serif;
        font-style: normal;
        font-weight: 400;
        font-size: 100px;
        line-height: 1;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #f4f4f5;
        padding-left: 0.28em;
        white-space: nowrap;
        z-index: 2;
      }
      .tiles {
        color: #9fe830;
        text-shadow:
          0 0 10px hsla(84, 80%, 55%, 0.95),
          0 0 28px hsla(84, 80%, 55%, 0.75),
          0 0 64px hsla(84, 80%, 45%, 0.5),
          0 0 110px hsla(84, 80%, 40%, 0.32);
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <h1 class="wordmark">DEAD<span class="tiles">TILES</span></h1>
    </div>
  </body>
</html>
