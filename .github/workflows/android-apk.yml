name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the client into the Android project
        run: npm run apk:sync
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Build the APK
        working-directory: packages/client/android
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp packages/client/android/app/build/outputs/apk/debug/app-debug.apk deadtiles.apk
          notes="Installable build of the Deadtiles Android app. It plays against https://play.deadtiles.com."
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk deadtiles.apk --clobber
          else
            gh release create apk deadtiles.apk --title "Deadtiles Android" --notes "$notes"
          fi
